plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.modelviewer3d'
    compileSdk 34

    defaultConfig {
        applicationId "com.modelviewer3d"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -frtti -fexceptions"
                arguments "-DANDROID_STL=c++_shared", "-DANDROID_PLATFORM=android-24"
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    signingConfigs {
        // Use debug.keystore for both debug and release builds in CI.
        // For a Play Store upload, replace with your real keystore via
        // GitHub Secrets (KEYSTORE_PATH, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD).
        def keystoreEnv = System.getenv("KEYSTORE_PATH")
        def hasKeystoreEnv = keystoreEnv != null && !keystoreEnv.isEmpty() && file(keystoreEnv).exists()
        def hasLocalKeystore = file("${rootDir}/my-upload-key.jks").exists()
        def hasDebugKeystore = file("${rootDir}/debug.keystore").exists()

        release {
            if (hasKeystoreEnv) {
                storeFile file(keystoreEnv)
                storePassword System.getenv("STORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS") ?: "upload"
                keyPassword System.getenv("KEY_PASSWORD")
            } else if (hasLocalKeystore) {
                storeFile file("${rootDir}/my-upload-key.jks")
                storePassword System.getenv("STORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS") ?: "upload"
                keyPassword System.getenv("KEY_PASSWORD")
            } else if (hasDebugKeystore) {
                storeFile file("${rootDir}/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
        debug {
            storeFile file("${rootDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildFeatures {
        viewBinding false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packagingOptions {
        pickFirst '**/libc++_shared.so'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
}
