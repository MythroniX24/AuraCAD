name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Debug + Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GRADLE_OPTS: "-Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. JDK 17 ────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # ── 3. Bootstrap gradle-wrapper.jar ──────────────────────────────────────
      - name: Bootstrap Gradle wrapper jar
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading gradle-wrapper.jar from GitHub Gradle release..."
            mkdir -p gradle/wrapper
            # Try primary source
            wget -q -O gradle/wrapper/gradle-wrapper.jar \
              "https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar" || \
            # Fallback: build it from a known-good release binary
            curl -sL "https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar" \
              -o gradle/wrapper/gradle-wrapper.jar
            echo "✓ gradle-wrapper.jar downloaded ($(wc -c < gradle/wrapper/gradle-wrapper.jar) bytes)"
          else
            echo "✓ gradle-wrapper.jar already present"
          fi

      # ── 4. Setup Android SDK ──────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 5. Install NDK 27 + CMake 3.22 ───────────────────────────────────────
      # Version must match ndkVersion in app/build.gradle (27.0.12077973).
      - name: Install NDK and CMake
        run: |
          SDK_MANAGER="sdkmanager"
          if ! command -v sdkmanager &> /dev/null; then
            if [ -n "$ANDROID_HOME" ] && [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            elif [ -n "$ANDROID_SDK_ROOT" ] && [ -f "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDK_MANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            fi
          fi
          echo "Using sdkmanager: $SDK_MANAGER"
          yes | $SDK_MANAGER --licenses || true
          $SDK_MANAGER "ndk;27.0.12077973" "cmake;3.22.1"
          if [ -d "$ANDROID_HOME/ndk/27.0.12077973" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          elif [ -d "$ANDROID_SDK_ROOT/ndk/27.0.12077973" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
          fi

      # ── 6. Cache CMake build outputs ─────────────────────────────────────────
      - name: Cache CMake build outputs
        uses: actions/cache@v4
        with:
          path: app/.cxx
          key: cxx-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt','**/*.cpp','**/*.h') }}
          restore-keys: cxx-${{ runner.os }}-

      # ── 7. Fix gradlew permissions ────────────────────────────────────────────
      - name: Grant gradlew execute permission
        run: |
          sed -i 's/\r$//' ./gradlew || true
          chmod +x ./gradlew

      # ── 8. Run unit tests ────────────────────────────────────────────────────
      - name: Run unit tests
        run: |
          ./gradlew testDebugUnitTest \
            --no-daemon \
            --build-cache \
            --stacktrace \
            -Pandroid.ndkVersion=27.0.12077973

      # ── 9. Build Debug APK ────────────────────────────────────────────────────
      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --build-cache \
            --parallel \
            --stacktrace \
            -Pandroid.ndkVersion=27.0.12077973

      # ── 10. Build Release APK ──────────────────────────────────────────────────
      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --build-cache \
            --parallel \
            --stacktrace \
            -Pandroid.ndkVersion=27.0.12077973

      # ── 11. List built APKs ───────────────────────────────────────────────────
      - name: List built APKs
        run: find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      # ── 12. Show error logs on failure ────────────────────────────────────────
      - name: Show CMake error log on failure
        if: failure()
        run: |
          echo "── Last 200 lines of any failed-build log ──"
          find app/.cxx -name "*.log" -exec tail -n 200 {} \; 2>/dev/null || true
          find app/build -name "*.log" -exec tail -n 200 {} \; 2>/dev/null || true

      # ── 13. Upload unit-test reports on failure ───────────────────────────────
      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: app/build/reports/tests
          retention-days: 14

      # ── 14. Upload Debug APK ──────────────────────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AuraCAD-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # ── 15. Upload Release APK ────────────────────────────────────────────────
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AuraCAD-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # ── 16. Create GitHub Release on version tag ──────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
